name: Desk briefings (deep-topic research)

# Generates sourced briefings for tracked topics using Tavily search + Haiku.
# Runs daily, staggered from the main sync. Independent failure domain — a
# Tavily outage never blocks RSS/GDELT/enrich.
#
# Schedule: 14:30 UTC ≈ 7:30am Pacific (sync runs at 13:00 and 01:00 UTC).
on:
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:

jobs:
  briefings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate briefings
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python ingest/briefings.py
