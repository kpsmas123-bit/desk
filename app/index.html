<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk — News Feed</title>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Lora:wght@400;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --field: #1B3A5C;
    --field-deep: #142D4A;
    --cream: #EAE1C6;
    --ink: #1A2636;
    --gold: #D4A843;
    --gold-wash: rgba(212,168,67,.18);
    --gold-dim: #B8923A;
    --card: #EAE1C6;
    --muted: #8A9AAE;
    --muted-card: #6B7568;
    --accent: #D4A843;
    --accent-wash: rgba(212,168,67,.18);
    --live: #D46B2A;
    --live-wash: rgba(212,107,42,.2);
    --hair: rgba(234,225,198,.18);
    --hair-card: rgba(26,38,54,.12);
    --radius: 4px;
    --shadow: 0 12px 26px rgba(10,20,40,.22);
    --shadow-lift: 0 18px 32px rgba(10,20,40,.30);
    --spring: cubic-bezier(.34,1.4,.5,1);
    --font-sans: 'Poppins', system-ui, sans-serif;
    --h-font: 'Anton', sans-serif;
    --body-font: 'Lora', Georgia, serif;
    --label-font: 'Poppins', system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    margin: 0;
    font-family: var(--body-font);
    color: var(--cream);
    background: var(--field);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none; z-index: 70;
    opacity: .12;
    mix-blend-mode: soft-light;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(234,225,198,.04) 2px, rgba(234,225,198,.04) 4px
    );
  }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 34px 80px; position: relative; z-index: 1; }

  /* header */
  .top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
  .brandblock { display: flex; flex-direction: column; gap: 2px; }
  .wordmark {
    font-family: var(--label-font); font-weight: 800; font-size: 20px;
    letter-spacing: .02em; color: var(--cream);
  }
  .tagline {
    font-family: var(--label-font); font-size: 11px; font-weight: 600;
    color: var(--muted); letter-spacing: .06em; text-transform: uppercase;
  }

  /* breadcrumb strip */
  .crumbbar {
    background: rgba(234,225,198,.08); border: 1px solid var(--hair);
    border-radius: var(--radius); padding: 7px 12px; margin-bottom: 16px;
  }
  .crumb {
    font-family: var(--label-font);
    font-size: 12px; color: var(--muted); font-weight: 500;
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
  }
  .crumb .seg {
    background: rgba(234,225,198,.1); border: 1px solid var(--hair);
    padding: 3px 10px; border-radius: var(--radius);
  }
  .crumb button.seg {
    cursor: pointer; color: var(--gold); font: inherit;
    transition: transform .2s var(--spring), background .2s ease;
  }
  .crumb button.seg:hover { transform: translateY(-1px); background: rgba(234,225,198,.15); }
  .crumb .sep { opacity: .5; }

  /* right-aligned header actions (gear + sign out) */
  .top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    font-family: var(--label-font); font-weight: 700; font-size: 12px;
    letter-spacing: .04em; text-transform: uppercase;
    border: 1px solid var(--hair); background: rgba(234,225,198,.08); color: var(--cream);
    padding: 7px 13px; border-radius: var(--radius); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: transform .15s, background .2s, color .2s;
    text-decoration: none;
  }
  .icon-btn:hover { transform: translateY(-1px); background: var(--gold); color: var(--ink); }
  .icon-btn:active { transform: translateY(0) scale(.97); }

  /* pill nav rows */
  nav.pages, .subnav {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  nav.pages { margin-bottom: 14px; }
  .subnav { margin-bottom: 22px; }
  .subnav:empty { display: none; }

  .pill {
    font-family: var(--label-font);
    font-weight: 700; font-size: 12px;
    letter-spacing: .04em; text-transform: uppercase;
    border: 1px solid var(--hair); background: rgba(234,225,198,.08); color: var(--cream);
    padding: 9px 16px; border-radius: var(--radius); cursor: pointer;
    transition: transform .15s, background .2s, color .2s;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .pill:hover { transform: translateY(-2px); background: rgba(234,225,198,.14); }
  .pill:active { transform: translateY(0) scale(.98); }
  .pill.active { background: var(--gold); color: var(--ink); border-color: var(--gold); }

  /* smaller pills for the second row (subpages / threads) */
  .subnav .pill { font-size: 11px; padding: 7px 13px; }
  .pill .pending-dot {
    font-family: var(--label-font); font-size: 9px; font-weight: 600;
    background: var(--live-wash); color: var(--live);
    padding: 1px 7px; border-radius: var(--radius);
  }
  .pill.active .pending-dot { background: rgba(26,38,54,.2); color: var(--ink); }

  .pill.add {
    background: transparent; color: var(--gold);
    border-style: dashed; border-color: var(--gold);
  }
  .pill.add:hover { background: rgba(212,168,67,.12); }

  /* top page nav: two-line pills (title + muted sub-label) */
  .pill.page { flex-direction: column; align-items: flex-start; gap: 1px; line-height: 1.2; }
  .pill.page .pill-title { font-weight: 800; font-size: 12px; }
  .pill.page .pill-sub {
    font-family: var(--label-font); font-weight: 500; font-size: 9px; color: var(--muted);
    letter-spacing: .03em;
  }
  .pill.page.active .pill-sub { color: rgba(26,38,54,.7); }

  /* small muted count on subpage/thread chips */
  .pill .chip-count {
    font-family: var(--label-font); font-weight: 500; font-size: 9px; color: var(--muted);
  }
  .pill.active .chip-count { color: rgba(26,38,54,.7); }

  /* page header block (eyebrow / headline / intro) */
  .page-header { margin: 4px 0 18px; }
  .page-header:empty { display: none; }
  .eyebrow {
    font-family: var(--label-font); font-size: 12px; font-weight: 600;
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 6px;
  }
  .page-h1 {
    font-family: var(--h-font); font-weight: 400; font-size: clamp(32px, 5vw, 48px);
    line-height: .92; text-transform: uppercase; color: var(--cream);
    text-shadow: 1px 1px 0 rgba(212,168,67,.45);
    margin: 0 0 6px;
  }
  @media (max-width: 600px) { .page-h1 { font-size: 30px; } }
  .page-intro {
    font-family: var(--body-font); font-size: 16px; line-height: 1.55;
    color: var(--cream); opacity: .8; margin: 10px 0 0; max-width: 48ch;
  }

  /* section label + controls above the feed */
  .feed-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
  .section-label {
    font-family: var(--label-font); font-size: 11px; font-weight: 700;
    letter-spacing: .1em; text-transform: uppercase;
    color: var(--gold);
  }
  .feed-controls { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .feed-controls .count { margin-left: 0; }
  .hairline {
    height: 1px; margin-bottom: 18px;
    background: linear-gradient(90deg, var(--gold) 0%, transparent 100%);
    opacity: .35;
  }

  /* create form */
  .newform {
    background: rgba(234,225,198,.08); border: 1px solid var(--hair); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 22px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .newform .ftitle {
    font-family: var(--label-font); font-weight: 700; font-size: 12px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--gold);
  }
  .newform input {
    font-family: var(--body-font); font-size: 14px; color: var(--cream);
    border: 1px solid var(--hair); border-radius: var(--radius); padding: 10px 13px; width: 100%;
    background: rgba(234,225,198,.06);
  }
  .newform input::placeholder { color: var(--muted); }
  .newform input:focus { outline: none; border-color: var(--gold); }
  .newform .hint { font-family: var(--label-font); font-size: 11px; color: var(--muted); line-height: 1.5; }
  .newform .row { display: flex; gap: 8px; }
  .btn {
    font-family: var(--label-font); font-weight: 700; font-size: 12px;
    letter-spacing: .06em; text-transform: uppercase;
    border-radius: var(--radius); padding: 9px 18px; cursor: pointer; border: none;
    transition: transform .15s, background .2s;
  }
  .btn:active { transform: scale(.96); }
  .btn.primary { background: var(--gold); color: var(--ink); }
  .btn.primary:hover { background: var(--gold-dim); }
  .btn.ghost { background: rgba(234,225,198,.08); color: var(--cream); border: 1px solid var(--hair); }
  .btn.ghost:hover { background: rgba(234,225,198,.14); }

  /* controls */
  .controls {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .controls .ctl-label {
    font-family: var(--label-font); font-size: 11px; font-weight: 600;
    color: var(--muted); letter-spacing: .03em; text-transform: uppercase;
  }
  select {
    font-family: var(--label-font); font-weight: 600; font-size: 12px;
    color: var(--cream); background: rgba(234,225,198,.08);
    border: 1px solid var(--hair); border-radius: var(--radius);
    padding: 8px 14px; cursor: pointer;
  }
  .count {
    margin-left: auto;
    font-family: var(--label-font); font-size: 11px; font-weight: 500;
    color: var(--muted);
  }

  /* feed grid */
  #feed { display: grid; grid-template-columns: 1fr; gap: 18px; }
  @media (min-width: 860px) { #feed { grid-template-columns: 1fr 1fr; } }

  /* tile */
  .tile {
    background: var(--card); color: var(--ink);
    border-radius: var(--radius); padding: 20px 22px 16px;
    box-shadow: var(--shadow);
    transition: transform .15s, box-shadow .15s;
    display: flex; flex-direction: column; gap: 10px;
  }
  .tile:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); }

  .tile .meta {
    font-family: var(--label-font); font-size: 10.5px; font-weight: 600;
    color: var(--muted-card);
    display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  }
  .tile .meta .src { color: var(--ink); font-weight: 700; }
  .tile .meta .dot { opacity: .45; }

  .topic {
    font-family: var(--label-font); font-weight: 700; font-size: 10px;
    background: var(--gold-wash); color: var(--gold-dim);
    padding: 2px 9px; border-radius: var(--radius);
    letter-spacing: .03em; text-transform: uppercase;
  }
  .lean {
    font-family: var(--label-font); font-weight: 700; font-size: 10px;
    background: var(--live-wash); color: #B85A1E;
    padding: 2px 9px; border-radius: var(--radius); text-transform: capitalize;
  }

  .tile h2 {
    margin: 0; font-family: var(--h-font); font-weight: 400;
    font-size: 20px; line-height: 1.1; text-transform: uppercase;
  }
  .tile h2 a { color: var(--ink); text-decoration: none; }
  .tile h2 a:hover { color: var(--field); }

  .summary { font-family: var(--body-font); font-size: 14px; line-height: 1.55; color: var(--ink); margin: 0; }
  .headline-only { font-family: var(--body-font); font-size: 13.5px; font-style: italic; color: var(--muted-card); margin: 0; }

  .bullets { margin: 2px 0 0; padding-left: 18px; }
  .bullets li { font-family: var(--body-font); font-size: 13px; line-height: 1.55; color: var(--ink); opacity: .82; margin-bottom: 3px; }

  .verify-note {
    font-family: var(--label-font); font-size: 10px; font-weight: 600;
    color: var(--muted-card);
    background: rgba(26,38,54,.06); border: 1px solid var(--hair-card);
    border-radius: var(--radius); padding: 5px 10px; align-self: flex-start;
    letter-spacing: .03em; text-transform: uppercase;
  }

  /* further reading: dashed divider + link buttons */
  .further { margin-top: 2px; }
  .further-head {
    font-family: var(--label-font); font-size: 10px; font-weight: 700;
    letter-spacing: .07em; text-transform: uppercase;
    color: var(--muted-card);
    border-top: 1px dashed var(--hair-card); padding-top: 10px;
  }
  .further-links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .further-link {
    font-family: var(--label-font); font-size: 11px; font-weight: 600;
    color: var(--field); text-decoration: none;
    border: 1px solid var(--hair-card); background: rgba(26,38,54,.04);
    padding: 5px 11px; border-radius: var(--radius);
    transition: transform .15s, background .2s;
  }
  .further-link:hover { transform: translateY(-1px); background: var(--gold-wash); color: var(--ink); }

  .actions { display: flex; gap: 8px; margin-top: 4px; padding-top: 12px; border-top: 1px solid var(--hair-card); }
  .act {
    font-family: var(--label-font); font-weight: 700; font-size: 11px;
    letter-spacing: .04em; text-transform: uppercase;
    border: 1px solid var(--hair-card); background: transparent; color: var(--field);
    padding: 7px 13px; border-radius: var(--radius); cursor: pointer;
    transition: transform .15s, background .2s, color .2s;
  }
  .act:hover { transform: translateY(-1px); background: var(--gold-wash); color: var(--ink); }
  .act:active { transform: translateY(0) scale(.96); }

  /* states */
  .state {
    grid-column: 1 / -1;
    background: rgba(234,225,198,.08); border: 1px solid var(--hair);
    border-radius: var(--radius); padding: 40px;
    text-align: center; color: var(--cream); box-shadow: var(--shadow);
    font-family: var(--body-font); font-size: 16px; line-height: 1.55;
  }
  .state .big {
    font-family: var(--h-font); font-size: 22px; text-transform: uppercase;
    color: var(--cream); display: block; margin-bottom: 8px;
    text-shadow: 1px 1px 0 rgba(212,168,67,.45);
  }
  .error {
    background: var(--live-wash); border: 1px solid rgba(212,107,42,.3);
    color: var(--cream); border-radius: var(--radius);
    padding: 18px 20px; white-space: pre-wrap;
    font-family: var(--body-font); font-size: 14px; line-height: 1.5;
  }
  .skeleton {
    background: rgba(234,225,198,.06); border: 1px solid var(--hair);
    border-radius: var(--radius); height: 150px;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: .6; } 50% { opacity: .3; } }

  /* toast */
  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: var(--cream); color: var(--ink);
    font-family: var(--label-font); font-weight: 700; font-size: 13px;
    padding: 11px 18px; border-radius: var(--radius); box-shadow: var(--shadow-lift);
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease, transform .35s var(--spring); z-index: 80;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ===== login screen (overlay modal, hidden by default) ===== */
  .login {
    display: none; align-items: center; justify-content: center;
    padding: 24px;
    position: fixed; inset: 0; z-index: 90;
    background: rgba(10,20,40,.6);
  }
  .login.show { display: flex; }
  .login-close {
    position: absolute; top: 16px; right: 16px;
    border: 1px solid var(--hair); background: rgba(234,225,198,.08); color: var(--cream);
    width: 34px; height: 34px; border-radius: var(--radius); cursor: pointer; font-size: 16px;
  }
  .login-close:hover { background: rgba(234,225,198,.15); }

  /* public mode: hide per-user chrome */
  body.public-mode .pill-nav-hide,
  body.public-mode .crumbbar,
  body.public-mode .subnav,
  body.public-mode #nav,
  body.public-mode #pendingQueue,
  body.public-mode #formHost,
  body.public-mode #pageHeader,
  body.public-mode .auth-only,
  body.public-mode .actions { display: none !important; }
  .login-card {
    background: var(--field-deep); border: 1px solid var(--hair); border-radius: var(--radius);
    box-shadow: var(--shadow-lift); padding: 34px 30px; width: 100%; max-width: 380px;
    display: flex; flex-direction: column; gap: 14px; text-align: left;
  }
  .login-brand {
    font-family: var(--h-font); font-size: 36px; font-weight: 400;
    text-transform: uppercase; color: var(--cream);
    text-shadow: 1px 1px 0 rgba(212,168,67,.45);
  }
  .login-sub { font-family: var(--body-font); color: var(--muted); font-size: 14.5px; line-height: 1.5; margin-bottom: 4px; }
  .login-card input {
    font-family: var(--body-font); font-size: 15px; color: var(--cream);
    border: 1px solid var(--hair); border-radius: var(--radius); padding: 12px 14px; width: 100%;
    background: rgba(234,225,198,.06);
  }
  .login-card input::placeholder { color: var(--muted); }
  .login-card input:focus { outline: none; border-color: var(--gold); }
  .login-card .btn.primary { width: 100%; padding: 12px; font-size: 13px; }
  .login-hint { font-family: var(--label-font); font-size: 11px; color: var(--muted); line-height: 1.5; }
  .login-check { color: var(--cream); font-size: 14.5px; line-height: 1.55; }
  .login-check-big { font-family: var(--h-font); font-size: 22px; font-weight: 400; text-transform: uppercase; margin-bottom: 6px; }
  .login-error {
    font-family: var(--label-font); font-size: 12px; line-height: 1.45; color: var(--cream);
    background: var(--live-wash); border: 1px solid rgba(212,107,42,.3);
    border-radius: var(--radius); padding: 9px 12px;
  }
  .login-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .login-link {
    font-family: var(--label-font); font-weight: 700; font-size: 12px; color: var(--gold);
    background: none; border: none; padding: 0; cursor: pointer;
  }
  .login-link:hover { text-decoration: underline; }
  .login-link.muted { color: var(--muted); font-weight: 500; }

  /* ===== appearance sheet ===== */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(10,20,40,.6);
    display: none; align-items: center; justify-content: center; padding: 20px; z-index: 80;
  }
  .sheet-backdrop.show { display: flex; }
  .sheet-card {
    background: var(--field-deep); border: 1px solid var(--hair); border-radius: var(--radius);
    box-shadow: var(--shadow-lift); padding: 22px; width: 100%; max-width: 380px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .sheet-head { display: flex; align-items: center; }
  .sheet-title { font-family: var(--h-font); font-size: 20px; font-weight: 400; text-transform: uppercase; color: var(--cream); }
  .sheet-x {
    margin-left: auto; border: 1px solid var(--hair); background: rgba(234,225,198,.08); color: var(--cream);
    width: 30px; height: 30px; border-radius: var(--radius); cursor: pointer; font-size: 14px;
  }
  .sheet-x:hover { background: rgba(234,225,198,.15); }
  .sheet-section { display: flex; flex-direction: column; gap: 9px; }
  .sheet-section.row-between { flex-direction: row; align-items: center; }
  .sheet-section.row-between .sheet-label { margin-right: auto; }
  .sheet-label { font-family: var(--label-font); font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch {
    font-family: var(--label-font); font-weight: 700; font-size: 11px; color: var(--cream);
    border: 1px solid var(--hair); background: rgba(234,225,198,.08); border-radius: var(--radius);
    padding: 6px 12px 6px 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
    transition: transform .15s, border-color .2s;
  }
  .swatch span { width: 16px; height: 16px; border-radius: 50%; display: inline-block; }
  .swatch:hover { transform: translateY(-1px); }
  .swatch.sel { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-wash); }
  .seg { display: inline-flex; border: 1px solid var(--hair); border-radius: var(--radius); overflow: hidden; background: rgba(234,225,198,.06); }
  .seg button {
    font-family: var(--label-font); font-weight: 700; font-size: 11px; color: var(--cream);
    border: none; background: transparent; padding: 8px 14px; cursor: pointer;
    letter-spacing: .03em;
  }
  .seg button.sel { background: var(--gold); color: var(--ink); }
  .toggle {
    width: 46px; height: 26px; border-radius: 999px; border: 1px solid var(--hair);
    background: rgba(234,225,198,.08); cursor: pointer; position: relative; padding: 0;
    transition: background .2s ease;
  }
  .toggle.on { background: var(--gold); border-color: var(--gold); }
  .toggle .knob {
    position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 999px;
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s var(--spring);
  }
  .toggle.on .knob { transform: translateX(20px); }

  /* ===== compact density ===== */
  body.compact .wrap { padding: 16px 20px 60px; }
  body.compact #feed { gap: 12px; }
  body.compact .tile { padding: 14px 16px 12px; gap: 7px; }
  body.compact .pill { padding: 7px 13px; font-size: 11px; }
  body.compact nav.pages { margin-bottom: 10px; }
  body.compact .subnav { margin-bottom: 14px; }
  body.compact .tile h2 { font-size: 14px; }
  body.compact .summary { font-size: 13px; }

  /* ===== sync bar (live countdown) ===== */
  .syncbar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .next-refresh {
    font-family: var(--label-font); font-size: 11px; font-weight: 500; color: var(--muted);
    background: rgba(234,225,198,.08); border: 1px solid var(--hair); border-radius: var(--radius);
    padding: 6px 13px; display: inline-flex; align-items: center; gap: 7px;
  }
  .next-refresh::before {
    content: ""; width: 7px; height: 7px; border-radius: 50%;
    background: var(--gold); display: inline-block;
  }

  /* ===== pending queue ("Building at next refresh") ===== */
  .pending-queue { margin-bottom: 18px; }
  .pq-card {
    background: rgba(212,168,67,.1); border: 1px solid var(--hair); border-radius: var(--radius);
    padding: 14px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 9px;
  }
  .pq-head {
    font-family: var(--label-font); font-weight: 800; font-size: 13px;
    color: var(--cream); display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .pq-when { font-family: var(--label-font); font-weight: 500; font-size: 11px; color: var(--muted); }
  .pq-item { display: flex; align-items: center; gap: 10px; }
  .pq-kind {
    font-family: var(--label-font); font-size: 9px; font-weight: 600; color: var(--muted);
    background: rgba(234,225,198,.08); border: 1px solid var(--hair); border-radius: var(--radius);
    padding: 2px 8px; text-transform: uppercase; letter-spacing: .05em;
  }
  .pq-title { font-family: var(--label-font); font-size: 13px; font-weight: 700; color: var(--cream); flex: 1; min-width: 0; }
  .pq-pill {
    font-family: var(--label-font); font-size: 9px; font-weight: 600;
    background: var(--live-wash); color: var(--live); padding: 2px 9px; border-radius: var(--radius);
    letter-spacing: .03em; text-transform: uppercase;
  }
  body.compact .syncbar { margin-bottom: 10px; }
  body.compact .pending-queue { margin-bottom: 12px; }

  /* ===== "+ Thread" popover body ===== */
  #threadSheetBody { display: flex; flex-direction: column; gap: 18px; }
  #threadSheetBody input {
    font-family: var(--body-font); font-size: 14px; color: var(--cream);
    border: 1px solid var(--hair); border-radius: var(--radius); padding: 10px 13px; width: 100%;
    background: rgba(234,225,198,.06);
  }
  #threadSheetBody input::placeholder { color: var(--muted); }
  #threadSheetBody input:focus { outline: none; border-color: var(--gold); }
  #threadSheetBody select {
    width: 100%;
    font-family: var(--label-font); font-weight: 600; font-size: 12px;
    color: var(--cream); background: rgba(234,225,198,.08);
    border: 1px solid var(--hair); border-radius: var(--radius); padding: 8px 14px;
  }
  #threadSheetBody .btn.primary { width: 100%; }
  .ts-section { display: flex; flex-direction: column; gap: 9px; }
  .ts-thread-list { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow: auto; }
  .ts-thread {
    font-family: var(--label-font); font-weight: 700; font-size: 12px; color: var(--cream);
    text-align: left; border: 1px solid var(--hair); background: rgba(234,225,198,.08);
    border-radius: var(--radius);
    padding: 9px 12px; cursor: pointer; display: flex; align-items: center; gap: 8px;
    transition: transform .15s, background .2s;
  }
  .ts-thread:hover:not([disabled]) { transform: translateY(-1px); background: rgba(234,225,198,.15); }
  .ts-thread[disabled] { cursor: default; opacity: .6; }
  .ts-thread-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ts-tagged-pill {
    font-family: var(--label-font); font-size: 9px; font-weight: 600;
    background: var(--gold-wash); color: var(--gold); padding: 2px 9px; border-radius: var(--radius);
    letter-spacing: .03em; text-transform: uppercase;
  }
  .ts-empty, .ts-loading { color: var(--muted); font-size: 13px; line-height: 1.5; }

  /* ===== Organize mode ===== */
  /* The Organize view is a "mode": the reading pieces hide and #organizeRoot
     shows, while the header + breadcrumb strip stay put. */
  #organizeRoot { display: none; }
  body.organizing #organizeRoot { display: block; }
  body.organizing #nav,
  body.organizing #pageHeader,
  body.organizing #pendingQueue,
  body.organizing #subnav,
  body.organizing #formHost,
  body.organizing .feed-head,
  body.organizing .hairline,
  body.organizing #feed { display: none !important; }

  .org-top { margin-bottom: 10px; }
  .org-head { margin: 4px 0 22px; }
  .org-section { margin-bottom: 30px; }
  .org-cards { display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; }
  .org-empty { color: var(--muted); font-size: 13.5px; padding: 6px 2px; }

  .org-card {
    background: rgba(234,225,198,.08); border: 1px solid var(--hair); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 14px 16px;
    display: flex; align-items: flex-start; gap: 12px;
    transition: box-shadow .2s;
  }
  .org-card.focused { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-wash), var(--shadow); }
  .org-card.dragging { opacity: .45; }
  .org-card.drop-before { box-shadow: inset 0 3px 0 var(--gold), var(--shadow); }
  .org-card.drop-after  { box-shadow: inset 0 -3px 0 var(--gold), var(--shadow); }

  .org-grip {
    cursor: grab; color: var(--muted); font-size: 18px; line-height: 1;
    padding-top: 8px; user-select: none; letter-spacing: -2px;
  }
  .org-grip:active { cursor: grabbing; }

  .org-fields { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .org-title, .org-desc {
    font-family: var(--label-font); color: var(--cream);
    border: 1px solid var(--hair); border-radius: var(--radius); padding: 9px 12px; width: 100%;
    background: rgba(234,225,198,.06);
  }
  .org-title { font-weight: 800; font-size: 14px; }
  .org-desc { font-size: 13px; font-weight: 500; }
  .org-title::placeholder, .org-desc::placeholder { color: var(--muted); }
  .org-title:focus, .org-desc:focus { outline: none; border-color: var(--gold); }

  .org-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .org-chip {
    font-family: var(--label-font); font-size: 10px; font-weight: 600; color: var(--muted);
    background: rgba(234,225,198,.06); border: 1px solid var(--hair);
    padding: 3px 10px; border-radius: var(--radius); max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    letter-spacing: .03em;
  }
  .org-chip.pending { background: var(--live-wash); color: var(--live); border-color: transparent; }
  .org-rebuild {
    font-family: var(--label-font); font-size: 10px; font-weight: 600;
    background: var(--gold-wash); color: var(--gold);
    padding: 3px 10px; border-radius: var(--radius);
    letter-spacing: .03em;
  }
  .org-card-actions { display: flex; align-items: center; }
  .org-open {
    font-family: var(--label-font); font-weight: 700; font-size: 11px;
    letter-spacing: .04em; text-transform: uppercase;
    border: 1px solid var(--hair); background: rgba(234,225,198,.08); color: var(--cream);
    padding: 7px 12px; border-radius: var(--radius); cursor: pointer; white-space: nowrap;
    transition: transform .15s, background .2s, color .2s;
  }
  .org-open:hover { transform: translateY(-1px); background: var(--gold); color: var(--ink); }
  .org-add {
    font-family: var(--label-font); font-weight: 700; font-size: 12px;
    letter-spacing: .06em; text-transform: uppercase;
    background: transparent; color: var(--gold);
    border: 1px dashed var(--gold); border-radius: var(--radius);
    padding: 9px 16px; cursor: pointer;
    transition: background .2s, transform .15s;
  }
  .org-add:hover { background: rgba(212,168,67,.12); transform: translateY(-1px); }
  body.compact .org-card { padding: 11px 13px; }
  body.compact .org-section { margin-bottom: 20px; }

  @media (max-width: 640px) {
    .wrap { padding: 16px 20px 60px; }
    .top { gap: 10px; }
    .wordmark { font-size: 17px; }
    .top-actions { gap: 6px; flex-wrap: wrap; }
    .icon-btn { font-size: 11px; padding: 6px 10px; }
    .page-h1 { font-size: 28px; }
    .tile h2 { font-size: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<!-- login screen (shown when there is no session) -->
<div class="login" id="loginScreen">
  <button class="login-close" id="loginClose" title="Close">✕</button>
  <div class="login-card">
    <div class="login-brand">Desk</div>
    <div class="login-sub" id="loginSub">Your news feed. Sign in to your private desk.</div>
    <div id="loginForm">
      <input id="loginEmail" type="email" placeholder="you@example.com" autocomplete="email" inputmode="email">
      <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
      <button class="btn primary" id="loginBtn">Sign in</button>
      <div class="login-error" id="loginError" style="display:none"></div>
      <div class="login-row">
        <button class="login-link" id="loginToggle" type="button">Create account</button>
        <button class="login-link muted" id="loginForgot" type="button">Forgot password?</button>
      </div>
      <div class="login-hint" id="loginHint" style="display:none">Use at least 6 characters for your password.</div>
    </div>
  </div>
</div>

<!-- the app (shown when signed in) -->
<div class="wrap" id="appRoot">
  <div class="top">
    <div class="brandblock">
      <a class="wordmark" href="index.html" style="text-decoration:none">DESK</a>
      <div class="tagline">News Feed</div>
    </div>
    <div class="top-actions">
      <span class="next-refresh auth-only" id="nextRefresh">Next refresh in —</span>
      <a class="icon-btn" href="briefings.html" title="Thread library">◉ Thread Library</a>
      <button class="icon-btn" id="signinBtn" style="display:none">Sign in</button>
      <button class="icon-btn auth-only" id="organizeBtn" title="Organize your pages, sub-pages & threads">⌗ Organize</button>
      <button class="icon-btn auth-only" id="gearBtn" title="Appearance">⚙︎ Appearance</button>
      <button class="icon-btn auth-only" id="signoutBtn" title="Sign out">Sign out</button>
    </div>
  </div>

  <nav class="pages" id="nav"></nav>

  <div class="crumbbar"><div class="crumb" id="crumb"><span class="seg">~</span></div></div>

  <div class="page-header" id="pageHeader"></div>

  <div class="pending-queue" id="pendingQueue" style="display:none"></div>

  <div class="subnav" id="subnav"></div>
  <div id="formHost"></div>

  <div class="feed-head">
    <span class="section-label" id="sectionLabel">LATEST ACROSS THE BEAT</span>
    <div class="feed-controls">
      <span class="ctl-label">Sort</span>
      <select id="sort">
        <option value="relevance">Most relevant</option>
        <option value="newest">Newest</option>
        <option value="reliability">Most reliable</option>
      </select>
      <span class="count" id="count"></span>
    </div>
  </div>
  <div class="hairline"></div>

  <div id="feed">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>

  <!-- Organize mode lives here; hidden until the ORGANIZE button toggles it on -->
  <div id="organizeRoot"></div>
</div>

<!-- appearance sheet -->
<div class="sheet-backdrop" id="sheet">
  <div class="sheet-card">
    <div class="sheet-head"><span class="sheet-title">Appearance</span><button class="sheet-x" id="sheetClose">✕</button></div>
    <div class="sheet-section">
      <div class="sheet-label">Theme</div>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="sheet-section row-between">
      <div class="sheet-label">Dark mode</div>
      <button class="toggle" id="darkToggle" role="switch" aria-label="Dark mode"><span class="knob"></span></button>
    </div>
    <div class="sheet-section">
      <div class="sheet-label">Font</div>
      <div class="seg" id="fontSeg">
        <button data-font="jakarta">Sans</button>
        <button data-font="serif">Serif</button>
        <button data-font="mono">Mono</button>
      </div>
    </div>
    <div class="sheet-section">
      <div class="sheet-label">Density</div>
      <div class="seg" id="densitySeg">
        <button data-density="comfortable">Comfortable</button>
        <button data-density="compact">Compact</button>
      </div>
    </div>
  </div>
</div>

<!-- "+ Thread" popover: tag a story into an existing thread, or spin up a new one -->
<div class="sheet-backdrop" id="threadSheet">
  <div class="sheet-card">
    <div class="sheet-head"><span class="sheet-title">Add to a thread</span><button class="sheet-x" id="threadSheetClose">✕</button></div>
    <div id="threadSheetBody"></div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

(function () {
  var cfg = window.DESK_CONFIG;

  // ---- single place to change the per-user thread cap (cost guardrail) ----
  var THREAD_CAP = 15;

  // ---- elements ----
  var loginScreen = document.getElementById('loginScreen');
  var loginForm    = document.getElementById('loginForm');
  var loginEmail   = document.getElementById('loginEmail');
  var loginPassword= document.getElementById('loginPassword');
  var loginBtn     = document.getElementById('loginBtn');
  var loginError   = document.getElementById('loginError');
  var loginToggle  = document.getElementById('loginToggle');
  var loginForgot  = document.getElementById('loginForgot');
  var loginHint    = document.getElementById('loginHint');
  var loginSub     = document.getElementById('loginSub');
  var loginClose = document.getElementById('loginClose');
  var signinBtn  = document.getElementById('signinBtn');
  var appRoot   = document.getElementById('appRoot');
  var navEl     = document.getElementById('nav');
  var subnavEl  = document.getElementById('subnav');
  var formHostEl= document.getElementById('formHost');
  var crumbEl   = document.getElementById('crumb');
  var feedEl    = document.getElementById('feed');
  var countEl   = document.getElementById('count');
  var sortEl    = document.getElementById('sort');
  var toastEl   = document.getElementById('toast');
  var gearBtn   = document.getElementById('gearBtn');
  var signoutBtn= document.getElementById('signoutBtn');
  var organizeBtn  = document.getElementById('organizeBtn');
  var organizeRoot = document.getElementById('organizeRoot');
  var sheetEl   = document.getElementById('sheet');
  var sheetClose= document.getElementById('sheetClose');
  var swatchesEl= document.getElementById('swatches');
  var darkToggle= document.getElementById('darkToggle');
  var fontSeg   = document.getElementById('fontSeg');
  var densitySeg= document.getElementById('densitySeg');
  var nextRefreshEl = document.getElementById('nextRefresh');
  var pendingQueueEl= document.getElementById('pendingQueue');
  var pageHeaderEl  = document.getElementById('pageHeader');
  var sectionLabelEl= document.getElementById('sectionLabel');
  var threadSheet     = document.getElementById('threadSheet');
  var threadSheetClose= document.getElementById('threadSheetClose');
  var threadSheetBody = document.getElementById('threadSheetBody');

  // page slug -> region filter value (all stories are CA-region now)
  var REGION = {
    'ca-leg-labor': 'ca'
  };

  // page slug -> editorial copy for the nav sub-label, header eyebrow + intro.
  var PAGE_META = {
    'ca-leg-labor':  { sub: 'california news', eyebrow: 'CALIFORNIA LEGISLATURE + LABOR', intro: 'Bills, budget fights, and union campaigns shaping California.' }
  };
  function pageMeta(slug) { return PAGE_META[slug] || { sub: '', eyebrow: 'YOUR BEAT', intro: '' }; }

  var STORY_SELECT = 'id,title,source_name,url,summary,context_bullets,topics,lean,reliability_score,region,published_at,relevance_score,media_type,excerpt';

  var pages = [];
  // navigation state — which page / subpage / thread is open
  var sel = { page: null, subpage: null, thread: null };
  var stories = [];
  var pendingItems = [];   // the user's status='pending' subpages + threads
  var toastTimer = null;
  var reqToken = 0;   // guards against slow responses landing after a newer click
  var countdownStarted = false;

  // The sync schedule, hardcoded to match .github/workflows/sync.yml (UTC hours
  // 13:00 and 01:00 ≈ 6am / 6pm Pacific). The countdown is approximate — cron
  // isn't second-exact and DST drifts it ~1h — which is fine.
  var SYNC_UTC_HOURS = [13, 1];

  var sb = null;
  var currentUid = null;   // the signed-in user's id
  var loadedFor = null;    // which uid we've already booted the app for

  // ---- helpers ----
  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function slugify(s) {
    return String(s || '').toLowerCase().trim()
      .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'item';
  }
  function showError(msg) {
    feedEl.innerHTML = '<div class="error">Something went wrong.\n\n' + esc(msg) + '</div>';
  }
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2200);
  }
  function hasText(v) { return v != null && String(v).trim() !== ''; }
  function asArray(v) { return v == null ? [] : (Array.isArray(v) ? v : [v]); }
  function timeAgo(iso) {
    if (!iso) return '';
    var then = new Date(iso).getTime();
    if (isNaN(then)) return '';
    var s = Math.floor((Date.now() - then) / 1000);
    if (s < 60) return 'just now';
    var m = Math.floor(s / 60); if (m < 60) return m + 'm ago';
    var h = Math.floor(m / 60); if (h < 24) return h + 'h ago';
    var d = Math.floor(h / 24); if (d < 30) return d + 'd ago';
    var mo = Math.floor(d / 30); if (mo < 12) return mo + 'mo ago';
    return Math.floor(mo / 12) + 'y ago';
  }
  function isUnratedSource(s) {
    return s.lean === 'unrated' && Number(s.reliability_score) === 3;
  }

  // unwrap a supabase-js { data, error } response, throwing on error
  function unwrap(res) {
    if (res && res.error) throw new Error(res.error.message || JSON.stringify(res.error));
    return res ? res.data : null;
  }

  if (!cfg || !cfg.url || !cfg.key) {
    loginScreen.style.display = 'flex';
    loginForm.innerHTML = '<div class="login-hint">config.js is missing or empty. Make sure app/config.js sets window.DESK_CONFIG = { url, key }.</div>';
    return;
  }

  // supabase-js attaches the session JWT to every request automatically, so RLS
  // scopes all reads/writes to the signed-in user — no manual apikey headers.
  sb = createClient(cfg.url, cfg.key);

  // =========================================================================
  // THEMING (Light tier, per-user)
  // =========================================================================
  var ACCENTS = {
    indigo: { name: 'Indigo', accent: '#5B5BD6', wash: '#ECECFB', live: '#E0641E', liveWash: '#FCEBDE' },
    slate:  { name: 'Slate',  accent: '#4F5B6B', wash: '#EAEEF3', live: '#B7791F', liveWash: '#FAF1DC' },
    forest: { name: 'Forest', accent: '#2F8559', wash: '#E3F2EA', live: '#C05621', liveWash: '#FBE8DC' },
    claret: { name: 'Claret', accent: '#9F2B4E', wash: '#F7E5EC', live: '#B07A1F', liveWash: '#FAF1DC' },
    sand:   { name: 'Sand',   accent: '#A9772F', wash: '#F3ECDC', live: '#8C5A2B', liveWash: '#F1E4D0' }
  };
  var THEME_ORDER = ['indigo', 'slate', 'forest', 'claret', 'sand'];
  var LIGHT = { bg: '#EDEFF5', bgTint: '#F4F2FB', card: '#FFFFFF', ink: '#1B1B26', muted: '#777A8C', hair: '#E4E6EF' };
  var DARK  = { bg: '#14151C', bgTint: '#1B1C25', card: '#20212B', ink: '#ECEDF6', muted: '#9698AE', hair: '#2D2E3B' };
  var FONTS = {
    jakarta: '"Plus Jakarta Sans", -apple-system, Segoe UI, Roboto, sans-serif',
    serif:   'Georgia, "Iowan Old Style", "Times New Roman", serif',
    mono:    '"IBM Plex Mono", ui-monospace, SFMono-Regular, monospace'
  };

  // current applied preferences
  var prefs = { theme: 'indigo', dark_mode: false, font: 'jakarta', density: 'comfortable' };

  function hexToRgba(hex, a) {
    var h = hex.replace('#', '');
    var r = parseInt(h.substring(0, 2), 16);
    var g = parseInt(h.substring(2, 4), 16);
    var b = parseInt(h.substring(4, 6), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
  }
  function normTheme(t) {
    // the DB default is 'soft-default' (== the original Indigo look)
    return ACCENTS[t] ? t : 'indigo';
  }

  function applyPrefs(p) {
    p = p || {};
    prefs = {
      theme: normTheme(p.theme),
      dark_mode: !!p.dark_mode,
      font: FONTS[p.font] ? p.font : 'jakarta',
      density: p.density === 'compact' ? 'compact' : 'comfortable'
    };
    var a = ACCENTS[prefs.theme];
    var n = prefs.dark_mode ? DARK : LIGHT;
    var r = document.documentElement;
    r.style.setProperty('--bg', n.bg);
    r.style.setProperty('--bg-tint', n.bgTint);
    r.style.setProperty('--card', n.card);
    r.style.setProperty('--ink', n.ink);
    r.style.setProperty('--muted', n.muted);
    r.style.setProperty('--hair', n.hair);
    r.style.setProperty('--accent', a.accent);
    r.style.setProperty('--accent-wash', prefs.dark_mode ? hexToRgba(a.accent, 0.26) : a.wash);
    r.style.setProperty('--live', a.live);
    r.style.setProperty('--live-wash', prefs.dark_mode ? hexToRgba(a.live, 0.24) : a.liveWash);
    r.style.setProperty('--font-sans', FONTS[prefs.font]);
    document.body.classList.toggle('compact', prefs.density === 'compact');
  }

  async function loadPreferences() {
    try {
      var data = unwrap(await sb.from('preferences').select('theme,dark_mode,font,density').maybeSingle());
      applyPrefs(data || {});
    } catch (e) {
      applyPrefs({});
    }
    syncSheet();
  }

  async function savePreferences() {
    if (!currentUid) return;
    try {
      await sb.from('preferences').upsert({
        user_id: currentUid,
        theme: prefs.theme,
        dark_mode: prefs.dark_mode,
        font: prefs.font,
        density: prefs.density,
        updated_at: new Date().toISOString()
      });
    } catch (e) { /* non-fatal — the look is already applied locally */ }
  }

  // appearance sheet wiring
  function renderSwatches() {
    swatchesEl.innerHTML = THEME_ORDER.map(function (k) {
      var a = ACCENTS[k];
      return '<button class="swatch" data-theme="' + k + '"><span style="background:' + a.accent + '"></span>' + esc(a.name) + '</button>';
    }).join('');
  }
  function syncSheet() {
    Array.prototype.forEach.call(swatchesEl.querySelectorAll('.swatch'), function (b) {

  // =========================================================================
  // AUTH (email + password)
  // =========================================================================
  function openLoginOverlay() { loginScreen.classList.add('show'); }
  function closeLoginOverlay() { loginScreen.classList.remove('show'); }

  function enterPublicMode() {
    document.body.classList.add('public-mode');
    signinBtn.style.display = '';
    closeLoginOverlay();
    startPublicFeed();
  }
  function enterAuthMode() {
    document.body.classList.remove('public-mode');
    signinBtn.style.display = 'none';
    closeLoginOverlay();
  }

  // 'signin' = returning user; 'signup' = creating a new account
  var authMode = 'signin';

  function showLoginError(msg) { loginError.textContent = msg; loginError.style.display = 'block'; }
  function clearLoginError() { loginError.textContent = ''; loginError.style.display = 'none'; }

  // Switch the form between Sign in and Create account.
  function setMode(mode) {
    authMode = mode;
    clearLoginError();
    if (mode === 'signup') {
      loginSub.textContent = 'Create your private Desk — pick an email and a password (at least 6 characters).';
      loginBtn.textContent = 'Create account';
      loginToggle.textContent = 'Have an account? Sign in';
      loginPassword.setAttribute('autocomplete', 'new-password');
      loginHint.style.display = 'block';
    } else {
      loginSub.textContent = 'Your news feed. Sign in to your private desk.';
      loginBtn.textContent = 'Sign in';
      loginToggle.textContent = 'Create account';
      loginPassword.setAttribute('autocomplete', 'current-password');
      loginHint.style.display = 'none';
    }
    loginBtn.disabled = false;
  }

  // Turn Supabase's technical errors into plain English shown on the form.
  function friendlyAuthError(err, mode) {
    var m = ((err && (err.message || err.error_description)) || '') + '';
    var low = m.toLowerCase();
    if (low.indexOf('invalid login') !== -1 || low.indexOf('invalid credentials') !== -1)
      return "That email and password don't match. Check them, or create an account.";
    if (low.indexOf('already registered') !== -1 || low.indexOf('already been registered') !== -1 || low.indexOf('user already') !== -1)
      return 'That email is already registered — try signing in instead.';
    if (low.indexOf('at least 6') !== -1 || low.indexOf('password should be') !== -1 || low.indexOf('weak password') !== -1)
      return 'Password must be at least 6 characters.';
    if (low.indexOf('email not confirmed') !== -1)
      return 'Please confirm your email first — check your inbox for the confirmation link, then sign in.';
    if (low.indexOf('unable to validate email') !== -1 || low.indexOf('invalid email') !== -1)
      return "That email address doesn't look right.";
    if (low.indexOf('rate limit') !== -1 || low.indexOf('too many') !== -1)
      return 'Too many attempts — wait a moment and try again.';
    return m || 'Something went wrong — please try again.';
  }

  async function submitAuth() {
    var email = (loginEmail.value || '').trim();
    var password = loginPassword.value || '';
    clearLoginError();
    if (!email) { showLoginError('Enter your email.'); return; }
    if (!password) { showLoginError('Enter your password.'); return; }
    if (authMode === 'signup' && password.length < 6) {
      showLoginError('Password must be at least 6 characters.'); return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = authMode === 'signup' ? 'Creating…' : 'Signing in…';

    try {
      if (authMode === 'signup') {
        var up = await sb.auth.signUp({ email: email, password: password });
        if (up.error) throw up.error;
        // If the Supabase project has "Confirm email" turned OFF, signUp returns
        // a session and onAuthStateChange takes over (seeding the starter set).
        // If it's ON, there's no session yet — try an immediate sign-in; if that
        // fails, the email needs confirming first.
        if (!(up.data && up.data.session)) {
          var si = await sb.auth.signInWithPassword({ email: email, password: password });
          if (si.error) {
            setMode('signin');
            loginBtn.disabled = false; loginBtn.textContent = 'Sign in';
            showLoginError('Account created. Please check your email to confirm it, then sign in.');
            return;
          }
        }
        // success → onAuthStateChange runs startApp() → ensureStarterSet()
      } else {
        var res = await sb.auth.signInWithPassword({ email: email, password: password });
        if (res.error) throw res.error;
        // success → onAuthStateChange loads the app
      }
    } catch (err) {
      loginBtn.disabled = false;
      loginBtn.textContent = authMode === 'signup' ? 'Create account' : 'Sign in';
      showLoginError(friendlyAuthError(err, authMode));
    }
  }

  // Fallback only: this STILL sends an email (a password-reset link). Normal
  // sign-in is email + password and never emails anyone. Update the redirect URL
  // below if your live site address is different.
  async function forgotPassword() {
    var email = (loginEmail.value || '').trim();
    clearLoginError();
    if (!email) { showLoginError('Type your email above first, then tap “Forgot password?”.'); return; }
    try {
      var res = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: 'https://kpsmas123-bit.github.io/desk/'
      });
      if (res.error) throw res.error;
      showLoginError('If that email has an account, a password-reset link is on its way.');
    } catch (err) {
      showLoginError(friendlyAuthError(err, 'signin'));
    }
  }

  loginBtn.addEventListener('click', submitAuth);
  loginEmail.addEventListener('keydown', function (e) { if (e.key === 'Enter') submitAuth(); });
  loginPassword.addEventListener('keydown', function (e) { if (e.key === 'Enter') submitAuth(); });
  loginToggle.addEventListener('click', function () { setMode(authMode === 'signin' ? 'signup' : 'signin'); });
  loginForgot.addEventListener('click', forgotPassword);
  setMode('signin');

  signoutBtn.addEventListener('click', function () { sb.auth.signOut(); });
  signinBtn.addEventListener('click', function () { openLoginOverlay(); });
  loginClose.addEventListener('click', function () { closeLoginOverlay(); });
  loginScreen.addEventListener('click', function (e) { if (e.target === loginScreen) closeLoginOverlay(); });

  // onAuthStateChange fires an INITIAL_SESSION event on subscribe, so it also
  // covers the page-load session check, plus sign-in / sign-up / sign-out.
  sb.auth.onAuthStateChange(function (event, session) {
    var uid = session && session.user ? session.user.id : null;
    if (uid) {
      currentUid = uid;
      enterAuthMode();
      if (loadedFor !== uid) { loadedFor = uid; startApp(); }
    } else {
      currentUid = null; loadedFor = null;
      enterPublicMode();
    }
  });

  // =========================================================================
  // COUNTDOWN + PENDING QUEUE
  // =========================================================================
  function nextSyncDate() {
    var now = new Date();
    var best = null;
    // Look across today and tomorrow (UTC) for the soonest scheduled hour.
    for (var d = 0; d <= 1; d++) {
      for (var i = 0; i < SYNC_UTC_HOURS.length; i++) {
        var dt = new Date(Date.UTC(
          now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + d,
          SYNC_UTC_HOURS[i], 0, 0
        ));
        if (dt.getTime() > now.getTime() && (best === null || dt < best)) best = dt;
      }
    }
    return best;
  }

  function lastSyncDate() {
    var now = new Date();
    var best = null;
    for (var d = 0; d >= -1; d--) {
      for (var i = 0; i < SYNC_UTC_HOURS.length; i++) {
        var dt = new Date(Date.UTC(
          now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + d,
          SYNC_UTC_HOURS[i], 0, 0
        ));
        if (dt.getTime() <= now.getTime() && (best === null || dt > best)) best = dt;
      }
    }
    return best;
  }
  function fmtTime(dt) {
    if (!dt) return '';
    var h = dt.getHours(), m = dt.getMinutes();
    var ap = h >= 12 ? 'PM' : 'AM';
    var hh = h % 12; if (hh === 0) hh = 12;
    return hh + ':' + (m < 10 ? '0' + m : m) + ' ' + ap;
  }

  function tickCountdown() {
    var next = nextSyncDate();
    if (!next) { nextRefreshEl.textContent = 'Next refresh in —'; return; }
    var ms = Math.max(0, next.getTime() - Date.now());
    var totalMin = Math.floor(ms / 60000);
    var h = Math.floor(totalMin / 60);
    var m = totalMin % 60;
    var txt = h + 'h ' + m + 'm';
    nextRefreshEl.textContent = 'Next refresh in ' + txt;
    var pqWhen = document.getElementById('pqWhen');
    if (pqWhen) pqWhen.textContent = '· in ' + txt;
  }

  function renderPendingQueue() {
    if (!pendingItems.length) {
      pendingQueueEl.style.display = 'none';
      pendingQueueEl.innerHTML = '';
      return;
    }
    pendingQueueEl.style.display = 'block';
    var head = '<div class="pq-head">Building at next refresh <span class="pq-when" id="pqWhen"></span></div>';
    var list = pendingItems.map(function (it) {
      return '<div class="pq-item">' +
        '<span class="pq-kind">' + (it.kind === 'subpage' ? 'subpage' : 'thread') + '</span>' +
        '<span class="pq-title">' + esc(it.title) + '</span>' +
        '<span class="pq-pill">queued</span>' +
      '</div>';
    }).join('');
    pendingQueueEl.innerHTML = '<div class="pq-card">' + head + list + '</div>';
    tickCountdown();   // fill the "· in Xh Ym" immediately
  }

  async function loadPendingQueue() {
    try {
      var subs = unwrap(await sb.from('subpages').select('id,title,status').eq('status', 'pending')) || [];
      var ths  = unwrap(await sb.from('threads').select('id,title,status').eq('status', 'pending')) || [];
      pendingItems = subs.map(function (s) { return { kind: 'subpage', id: s.id, title: s.title }; })
        .concat(ths.map(function (t) { return { kind: 'thread', id: t.id, title: t.title }; }));
    } catch (e) {
      pendingItems = [];
    }
    renderPendingQueue();
  }

  // =========================================================================
  // PUBLIC FEED (anonymous visitors — no sign-in required)
  // =========================================================================
  async function startPublicFeed() {
    feedEl.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
    countEl.textContent = 'loading…';
    try {
      var data = unwrap(await sb.from('stories').select(STORY_SELECT)
        .order('relevance_score', { ascending: false, nullsFirst: false })
        .limit(100));
      if (!Array.isArray(data)) throw new Error('Expected a list of stories');
      stories = data;
      renderFeed();
    } catch (err) {
      showError(err.message || String(err));
    }
  }

  // =========================================================================
  // APP BOOT (after login)
  // =========================================================================
  async function startApp() {
    if (!countdownStarted) {
      countdownStarted = true;
      tickCountdown();
      setInterval(tickCountdown, 60000);   // tick live, once a minute
    }
    try {
      await loadPreferences();
      await ensureStarterSet();
      await loadPages();
      await loadPendingQueue();
    } catch (err) {
      showError(err.message || String(err));
    }
  }

  // STEP 3 — give brand-new users a fresh starter Desk. Do NOT set user_id:
  // the column default auth.uid() stamps it to the signed-in user.
  async function ensureStarterSet() {
    var existing = unwrap(await sb.from('pages').select('id').limit(1));
    if (existing && existing.length) return;  // already has pages — nothing to do

    var createdPages = unwrap(await sb.from('pages').insert([
      { title: 'CA Leg + Labor', slug: 'ca-leg-labor', position: 0 }
    ]).select());

    var ca = (createdPages || []).filter(function (p) { return p.slug === 'ca-leg-labor'; })[0];
    if (!ca) return;

    await sb.from('subpages').insert([
      { page_id: ca.id, title: 'State legislature & bills', slug: 'state-legislature-bills', status: 'pending', position: 0 },
      { page_id: ca.id, title: 'Labor campaigns', slug: 'labor-campaigns', status: 'pending', position: 1 },
      { page_id: ca.id, title: 'State prop campaigns', slug: 'state-prop-camp', status: 'pending', position: 2 },
      { page_id: ca.id, title: 'Midterm / Congress', slug: 'midterm-congress', status: 'pending', position: 3 }
    ]);
  }

  async function loadPages() {
    // Prefer selecting the optional `description` column (migration 0007). If
    // that migration hasn't been applied yet the column doesn't exist and the
    // query errors — fall back to the original select so the app still boots.
    var data;
    try {
      data = unwrap(await sb.from('pages').select('id,title,slug,position,description').order('position'));
    } catch (e) {
      data = unwrap(await sb.from('pages').select('id,title,slug,position').order('position'));
    }
    if (!data || !data.length) { showError('No pages found for your account.'); return; }
    pages = data;
    selectPage(pages[0]);
  }

  // ---- breadcrumb ----
  function setCrumb() {
    var parts = ['<span class="seg">~</span>'];
    if (sel.page) {
      parts.push('<span class="sep">/</span>');
      parts.push('<button class="seg" data-up="page">' + esc(sel.page.slug) + '</button>');
    }
    if (sel.subpage) {
      parts.push('<span class="sep">/</span>');
      parts.push('<button class="seg" data-up="subpage">' + esc(sel.subpage.slug || slugify(sel.subpage.title)) + '</button>');
    }
    if (sel.thread) {
      parts.push('<span class="sep">/</span>');
      parts.push('<span class="seg">' + esc(slugify(sel.thread.title)) + '</span>');
    }
    crumbEl.innerHTML = parts.join('');
    renderPageHeader();
  }

  // editorial header block: eyebrow + big headline + muted intro, adapting to
  // the open page / subpage / thread.
  function renderPageHeader() {
    if (!pageHeaderEl) return;
    if (!sel.page) { pageHeaderEl.innerHTML = ''; return; }
    var updated = 'UPDATED ' + fmtTime(lastSyncDate());
    var eyebrow, headline, intro;
    if (sel.thread) {
      eyebrow = (sel.subpage ? sel.subpage.title : sel.page.title).toUpperCase() + ' · ' + updated;
      headline = sel.thread.title;
      intro = sel.thread.description ||
        (sel.thread.status === 'pending' ? 'Queued — its query builds at the next refresh.' : 'A live thread tracking this topic.');
    } else if (sel.subpage) {
      eyebrow = sel.page.title.toUpperCase() + ' · ' + updated;
      headline = sel.subpage.title;
      intro = sel.subpage.description ||
        (sel.subpage.status === 'pending' ? 'Queued — its query builds at the next refresh.' : 'A live sub-page tracking this topic.');
    } else {
      var meta = pageMeta(sel.page.slug);
      eyebrow = meta.eyebrow + ' · ' + updated;
      headline = sel.page.title;
      // a page's own description (set in Organize) wins over the canned intro
      intro = hasText(sel.page.description) ? sel.page.description : meta.intro;
    }
    pageHeaderEl.innerHTML =
      '<div class="eyebrow">' + esc(eyebrow) + '</div>' +
      '<h1 class="page-h1">' + esc(headline) + '</h1>' +
      (intro ? '<p class="page-intro">' + esc(intro) + '</p>' : '');
  }
  crumbEl.addEventListener('click', function (e) {
    var btn = e.target.closest('button.seg');
    if (!btn) return;
    if (btn.getAttribute('data-up') === 'page') selectPage(sel.page);
    else if (btn.getAttribute('data-up') === 'subpage') selectSubpage(sel.subpage);
  });

  // ---- top nav (pages) ----
  function renderNav() {
    navEl.innerHTML = '';
    pages.forEach(function (p) {
      var b = document.createElement('button');
      b.className = 'pill page' + (sel.page === p ? ' active' : '');
      var meta = pageMeta(p.slug);
      b.innerHTML = '<span class="pill-title">' + esc(p.title) + '</span>' +
        (meta.sub ? '<span class="pill-sub">' + esc(meta.sub) + '</span>' : '');
      b.addEventListener('click', function () { selectPage(p); });
      navEl.appendChild(b);
    });
  }

  // ---- second row: subpages (at page level) or threads (deeper) ----
  function pendingDot(item) {
    return item.status === 'pending' ? '<span class="pending-dot">pending</span>' : '';
  }
  function renderSubnav() {
    closeForm();
    subnavEl.innerHTML = '';
    var atPageLevel = !sel.subpage;
    var items = atPageLevel ? (sel.page._subpages || []) : (sel.subpage._threads || []);

    items.forEach(function (item) {
      var b = document.createElement('button');
      var isActive = atPageLevel ? false : (sel.thread === item);
      b.className = 'pill' + (isActive ? ' active' : '');
      // Thread chips show a real story count (match_count from the health step).
      // Subpage chips have no per-subpage story count fetched, so none is shown.
      var count = (!atPageLevel && typeof item.match_count === 'number')
        ? '<span class="chip-count">' + item.match_count + '</span>' : '';
      b.innerHTML = '<span>' + esc(item.title) + '</span>' + count + pendingDot(item);
      b.addEventListener('click', function () {
        if (atPageLevel) selectSubpage(item);
        else selectThread(item);
      });
      subnavEl.appendChild(b);
    });

    var add = document.createElement('button');
    add.className = 'pill add';
    add.textContent = atPageLevel ? '+ New sub-page' : '+ New thread';
    add.addEventListener('click', function () { openForm(atPageLevel ? 'subpage' : 'thread'); });
    subnavEl.appendChild(add);
