  // ---- create form ----
  function closeForm() { formHostEl.innerHTML = ''; }
  function openForm(kind) {
    var noun = kind === 'subpage' ? 'subpage' : 'thread';
    var parentName = kind === 'subpage' ? sel.page.title : sel.subpage.title;
    formHostEl.innerHTML =
      '<div class="newform">' +
        '<div class="ftitle">New ' + noun + ' under "' + esc(parentName) + '"</div>' +
        '<input id="f_title" placeholder="Title (e.g. Oakland city council)" autocomplete="off">' +
        '<input id="f_desc" placeholder="One line: what should this track?" autocomplete="off">' +
        '<div class="hint">It appears right away as <b>pending</b>. Its search query is written once, automatically, the next time the sync runs — then it fills itself in. (No story is saved here; layers match live.)</div>' +
        '<div class="row">' +
          '<button class="btn primary" id="f_create">Create</button>' +
          '<button class="btn ghost" id="f_cancel">Cancel</button>' +
        '</div>' +
      '</div>';
    var titleEl = document.getElementById('f_title');
    titleEl.focus();
    document.getElementById('f_cancel').addEventListener('click', closeForm);
    document.getElementById('f_create').addEventListener('click', function () { submitForm(kind); });
    titleEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') submitForm(kind); });
    document.getElementById('f_desc').addEventListener('keydown', function (e) { if (e.key === 'Enter') submitForm(kind); });
  }

  async function submitForm(kind) {
    var title = document.getElementById('f_title').value.trim();
    var desc = document.getElementById('f_desc').value.trim();
    if (!title) { toast('Give it a title first'); return; }

    // STEP 4 — per-user thread cap (cost guardrail). Count this user's threads
    // (RLS scopes the count to them) and block past the cap.
    if (kind === 'thread') {
      try {
        var res = await sb.from('threads').select('id', { count: 'exact', head: true });
        if (res.error) throw res.error;
        if ((res.count || 0) >= THREAD_CAP) {
          toast("You've hit your thread limit (" + THREAD_CAP + ") — archive one to add another");
          return;
        }
      } catch (e) {
        toast('Could not check your thread count — try again');
        return;
      }
    }

    var btn = document.getElementById('f_create');
    btn.disabled = true; btn.textContent = 'Creating…';

    var table, body;
    if (kind === 'subpage') {
      table = 'subpages';
      body = {
        page_id: sel.page.id, title: title, slug: slugify(title),
        description: desc, status: 'pending', query: null,
        position: (sel.page._subpages || []).length
      };
    } else {
      table = 'threads';
      body = {
        subpage_id: sel.subpage.id, title: title, description: desc,
        status: 'pending', derived_query: null,
        position: (sel.subpage._threads || []).length
      };
    }

    // No user_id here on purpose — the column default auth.uid() stamps it,
    // and the RLS WITH CHECK confirms it matches the signed-in user.
    try {
      var rows = unwrap(await sb.from(table).insert(body).select());
      var created = Array.isArray(rows) && rows.length ? rows[0] : body;
      closeForm();
      if (kind === 'subpage') {
        sel.page._subpages = (sel.page._subpages || []).concat([created]);
        renderSubnav();
        selectSubpage(created);
      } else {
        sel.subpage._threads = (sel.subpage._threads || []).concat([created]);
        selectThread(created);
      }
      loadPendingQueue();   // the new item joins the "Building at next refresh" list
      toast('Created — query builds on next sync');
    } catch (err) {
      btn.disabled = false; btn.textContent = 'Create';
      toast('Could not save');
      showError('Could not create the ' + kind + '.\n\n' + (err.message || String(err)));
    }
  }

  // ---- "+ Thread" popover: tag a story into a thread (existing or new) ----
  threadSheetClose.addEventListener('click', function () { threadSheet.classList.remove('show'); });
  threadSheet.addEventListener('click', function (e) { if (e.target === threadSheet) threadSheet.classList.remove('show'); });

  async function openThreadSheet(story) {
    threadSheetBody.innerHTML = '<div class="ts-loading">Loading your threads…</div>';
    threadSheet.classList.add('show');

    var threads = [];
    var subpages = [];
    var tagged = {};   // thread_id -> true for threads this story is already in
    try {
      threads = unwrap(await sb.from('threads')
        .select('id,title,status').order('created_at', { ascending: false })) || [];
    } catch (e) { threads = []; }
    try {
      // Subpages to home a new thread in: the current page's if one is in
      // context, otherwise all of the user's.
      var sq = sb.from('subpages').select('id,title,page_id').order('position');
      if (sel.page) sq = sq.eq('page_id', sel.page.id);
      subpages = unwrap(await sq) || [];
    } catch (e) { subpages = []; }
    try {
      var tg = unwrap(await sb.from('story_threads')
        .select('thread_id').eq('story_id', story.id)) || [];
      tg.forEach(function (r) { tagged[r.thread_id] = true; });
    } catch (e) { /* leave tagged empty */ }

    renderThreadSheet(story, threads, subpages, tagged);
  }

  function renderThreadSheet(story, threads, subpages, tagged) {
    var rows = threads.length
      ? threads.map(function (t) {
          var isTagged = !!tagged[t.id];
          var right = isTagged
            ? '<span class="ts-tagged-pill">added</span>'
            : (t.status === 'pending' ? '<span class="pending-dot">pending</span>' : '');
          return '<button class="ts-thread" data-thread-id="' + esc(t.id) + '"' + (isTagged ? ' disabled' : '') + '>' +
            '<span class="ts-thread-title">' + esc(t.title) + '</span>' + right +
          '</button>';
        }).join('')
      : '<div class="ts-empty">No threads yet — create one above.</div>';

    var subOptions = subpages.map(function (sp) {
      return '<option value="' + esc(sp.id) + '">' + esc(sp.title) + '</option>';
    }).join('');

    threadSheetBody.innerHTML =
      '<div class="ts-section">' +
        '<div class="sheet-label">New thread from this story</div>' +
        '<input id="ts_title" placeholder="Thread title" autocomplete="off">' +
        '<input id="ts_desc" placeholder="One line: what should this track?" autocomplete="off">' +
        '<select id="ts_subpage">' +
          '<option value="" disabled selected>Choose a subpage…</option>' +
          subOptions +
          '<option value="__new__">+ New subpage…</option>' +
        '</select>' +
        '<input id="ts_newsub" placeholder="New subpage title" autocomplete="off" style="display:none">' +
        '<button class="btn primary" id="ts_create">Create &amp; tag</button>' +
      '</div>' +
      '<div class="ts-section">' +
        '<div class="sheet-label">Add to existing thread</div>' +
        '<div class="ts-thread-list">' + rows + '</div>' +
      '</div>';

    // prefill the title with the story's headline as a starting point
    var titleEl = document.getElementById('ts_title');
    titleEl.value = story.title || '';

    // reveal the inline "new subpage" field only when that option is picked
    var subSel = document.getElementById('ts_subpage');
    var newSub = document.getElementById('ts_newsub');
    subSel.addEventListener('change', function () {
      var isNew = subSel.value === '__new__';
      newSub.style.display = isNew ? 'block' : 'none';
      if (isNew) newSub.focus();
    });

    document.getElementById('ts_create').addEventListener('click', function () { createThreadFromStory(story); });
    titleEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') createThreadFromStory(story); });
    document.getElementById('ts_desc').addEventListener('keydown', function (e) { if (e.key === 'Enter') createThreadFromStory(story); });
    newSub.addEventListener('keydown', function (e) { if (e.key === 'Enter') createThreadFromStory(story); });

    threadSheetBody.querySelector('.ts-thread-list').addEventListener('click', function (e) {
      var b = e.target.closest('.ts-thread');
      if (!b || b.disabled) return;
      tagStoryToThread(story, b.getAttribute('data-thread-id'));
    });
  }

  async function tagStoryToThread(story, threadId) {
    try {
      // RLS on story_threads checks the thread belongs to this user.
      unwrap(await sb.from('story_threads').insert({ story_id: story.id, thread_id: threadId }));
      threadSheet.classList.remove('show');
      toast('Added to thread');
    } catch (err) {
      // primary key (story_id, thread_id) collision == already tagged
      toast('Already in that thread');
    }
  }

  async function createThreadFromStory(story) {
    var title = (document.getElementById('ts_title').value || '').trim();
    var desc = (document.getElementById('ts_desc').value || '').trim();
    if (!title) { toast('Give it a title first'); return; }

    // A thread MUST have a subpage home — never null. Require a choice first.
    var subSel = document.getElementById('ts_subpage');
    var subChoice = subSel.value;
    if (!subChoice) { toast('Choose a subpage for this thread'); return; }
    var newSubTitle = '';
    if (subChoice === '__new__') {
      newSubTitle = (document.getElementById('ts_newsub').value || '').trim();
      if (!newSubTitle) { toast('Name the new subpage first'); return; }
    }

    // We need a page to home a new subpage under. sel.page is always set in app
    // context, but guard anyway.
    if (subChoice === '__new__' && !sel.page) { toast('Open a page first'); return; }

    // Same per-user thread cap as the "+ New thread" flow (pending + tracking).
    // Checked BEFORE creating any subpage, so we never leave an orphan subpage.
    try {
      var res = await sb.from('threads').select('id', { count: 'exact', head: true });
      if (res.error) throw res.error;
      if ((res.count || 0) >= THREAD_CAP) {
        toast("You've hit your thread limit (" + THREAD_CAP + ") — archive one to add another");
        return;
      }
    } catch (e) {
      toast('Could not check your thread count — try again');
      return;
    }

    var btn = document.getElementById('ts_create');
    btn.disabled = true; btn.textContent = 'Creating…';

    try {
      // 1. Resolve the subpage home — create it first if "+ New subpage".
      var subId = subChoice;
      var createdSub = null;
      if (subChoice === '__new__') {
        var subBody = {
          page_id: sel.page.id, title: newSubTitle, slug: slugify(newSubTitle),
          description: '', status: 'pending', query: null,
          position: (sel.page._subpages || []).length
        };
        var subRows = unwrap(await sb.from('subpages').insert(subBody).select());
        createdSub = Array.isArray(subRows) && subRows.length ? subRows[0] : null;
        if (!createdSub) throw new Error('Subpage created but not returned.');
        subId = createdSub.id;
        // keep the page's cached subpage list in sync
        if (sel.page) sel.page._subpages = (sel.page._subpages || []).concat([createdSub]);
      }

      // 2. Create the thread under that subpage — subpage_id is always set.
      var body = {
        subpage_id: subId, title: title, description: desc,
        status: 'pending', derived_query: null,
        position: 0
      };
      var rows = unwrap(await sb.from('threads').insert(body).select());
      var created = Array.isArray(rows) && rows.length ? rows[0] : null;
      if (!created) throw new Error('Thread created but not returned.');

      // 3. Tag this story into the brand-new thread right away.
      unwrap(await sb.from('story_threads').insert({ story_id: story.id, thread_id: created.id }));

      // reflect in the nav: new subpage (at page level) and/or new thread (under
      // the open subpage)
      if (createdSub && !sel.subpage) renderSubnav();
      if (sel.subpage && created.subpage_id === sel.subpage.id) {
        sel.subpage._threads = (sel.subpage._threads || []).concat([created]);
        renderSubnav();
      }
      loadPendingQueue();
      threadSheet.classList.remove('show');
      toast('Thread created & tagged — query builds next sync');
    } catch (err) {
      btn.disabled = false; btn.textContent = 'Create & tag';
      toast('Could not create thread');
    }
  }

  // ---- story fetching per level ----
  function sortedRows() {
    var sort = sortEl.value;
    var rows = stories.slice();
    if (sort === 'newest') {
      rows.sort(function (a, b) { return String(b.published_at || '').localeCompare(String(a.published_at || '')); });
    } else if (sort === 'reliability') {
      rows.sort(function (a, b) { return (Number(b.reliability_score) || 0) - (Number(a.reliability_score) || 0); });
    }
    return rows;
  }
  function pendingState(noun) {
    feedEl.innerHTML = '<div class="state"><span class="big">Pending — query builds on the next sync</span>' +
      'This ' + noun + ' has no search query yet. Run the sync ' +
      '(<code>python3 ingest/run_ingest.py</code>) and it will write the query once, ' +
      'then fill itself in here automatically.</div>';
    countEl.textContent = 'showing 0 stories';
  }

  async function loadStories() {
    var myToken = ++reqToken;
    feedEl.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div>';
    countEl.textContent = 'loading…';

    var level = sel.thread ? 'thread' : (sel.subpage ? 'subpage' : 'page');

    try {
      var data;
      if (level === 'page') {
        // Phase-5 behavior: region filter, hide noise, relevance order.
        var region = REGION[sel.page.slug];
        var q = sb.from('stories').select(STORY_SELECT)
          .gt('relevance_score', 0)
          .order('relevance_score', { ascending: false, nullsFirst: false })
          .limit(100);
        if (region) q = q.eq('region', region);
        data = unwrap(await q);
      } else {
        // subpage/thread: match live by that level's query, ranked by ts_rank.
        var qry = level === 'thread' ? sel.thread.derived_query : sel.subpage.query;
        if (!hasText(qry)) { pendingState(level); return; }
        data = unwrap(await sb.rpc('search_stories', { q: qry }));
      }
      if (myToken !== reqToken) return;   // a newer navigation won; ignore this
      if (!Array.isArray(data)) throw new Error('Expected a list of stories but got:\n\n' + JSON.stringify(data, null, 2));
      stories = data;
      renderFeed();
    } catch (err) {
      if (myToken !== reqToken) return;
      showError(err.message || String(err));
    }
  }

  // ---- feed rendering (Phase 5 tiles, unchanged) ----
  function tileHtml(s) {
    // mono meta row, mockup order: source · lean · time, then topic tags
    var meta = '';
    if (hasText(s.source_name)) meta += '<span class="src">' + esc(s.source_name) + '</span>';
    if (s.lean && s.lean !== 'unrated') meta += '<span class="lean">' + esc(s.lean) + '</span>';
    var ago = timeAgo(s.published_at);
    if (ago) meta += '<span class="dot">·</span><span>' + esc(ago) + '</span>';
    asArray(s.topics).forEach(function (t) { if (hasText(t)) meta += '<span class="topic">' + esc(t) + '</span>'; });

    var head = hasText(s.url)
      ? '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.title || '(untitled)') + '</a>'
      : esc(s.title || '(untitled)');

    var body = hasText(s.summary)
      ? '<p class="summary">' + esc(s.summary) + '</p>'
      : '<p class="headline-only">Headline only — open to read</p>';

    var bullets = '';
    var bl = asArray(s.context_bullets).filter(hasText);
    if (bl.length) {
      bullets = '<ul class="bullets">' + bl.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    }

    var verify = isUnratedSource(s) ? '<div class="verify-note">unrated source — verify</div>' : '';

    // Further reading: the article link(s). Only the primary url exists today —
    // alt_links isn't populated by ingest, so this is single-link for now and
    // only labels "MULTI-LINK" if more links ever arrive.
    var links = [];
    if (hasText(s.url)) links.push({ url: s.url, label: s.source_name || 'Read the article' });
    asArray(s.alt_links).forEach(function (l) {
      if (l && hasText(l.url || l)) links.push({ url: (l.url || l), label: (l.label || l.source || 'Related link') });
    });
    var further = '';
    if (links.length) {
      further = '<div class="further">' +
        '<div class="further-head">Further reading' + (links.length > 1 ? ' · multi-link' : '') + '</div>' +
        '<div class="further-links">' +
          links.map(function (l) {
            return '<a class="further-link" href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + ' ↗</a>';
          }).join('') +
        '</div>' +
      '</div>';
    }

    return '<article class="tile" data-story-id="' + esc(s.id) + '">' +
      '<div class="meta">' + meta + '</div>' +
      '<h2>' + head + '</h2>' + body + bullets + verify + further +
      '<div class="actions">' +
        '<button class="act" data-act="thread">+ Thread</button>' +
      '</div>' +
    '</article>';
  }
  function threadEmptyHtml(t) {
    // A live ('tracking') thread that currently matches nothing: show its health
    // so a quiet thread reads as quiet, not broken.
    var last = t.last_match_at
      ? 'Last match ' + timeAgo(t.last_match_at) + '.'
      : 'Nothing has matched this thread yet.';
    return '<div class="state"><span class="big">No matches yet — may need broader sources</span>' +
      esc(last) + ' Try a broader title/description on a new thread, or wait for the next sync.</div>';
  }

  function sectionLabel() {
    if (!currentUid) return 'LATEST STORIES';
    if (sel.thread) return 'LATEST IN THIS THREAD';
    if (sel.subpage) return 'LATEST IN THIS SUB-PAGE';
    return 'LATEST ACROSS THE BEAT';
  }
  function renderFeed() {
    if (sectionLabelEl) sectionLabelEl.textContent = sectionLabel();
    if (!stories.length) {
      feedEl.innerHTML = (sel.thread && sel.thread.status === 'tracking')
        ? threadEmptyHtml(sel.thread)
        : '<div class="state">Nothing here yet — the next sync will fill this in.</div>';
      countEl.textContent = '0 stories';
      return;
    }
    var rows = sortedRows();
    countEl.textContent = rows.length + ' stor' + (rows.length === 1 ? 'y' : 'ies');
    feedEl.innerHTML = rows.map(tileHtml).join('');
  }
  feedEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.act');
    if (!btn) return;
    var act = btn.getAttribute('data-act');
    if (act === 'thread') {
      var tile = btn.closest('.tile');
      var sid = tile && tile.getAttribute('data-story-id');
      var story = stories.filter(function (s) { return s.id === sid; })[0];
      if (story) openThreadSheet(story);
    }
  });
  sortEl.addEventListener('change', renderFeed);

  // ---- navigation flow ----
  async function selectPage(p) {
    sel = { page: p, subpage: null, thread: null };
    renderNav();
    setCrumb();
    if (p._subpages) { renderSubnav(); }
    else {
      try {
        var rows = unwrap(await sb.from('subpages')
          .select('id,page_id,title,slug,query,status,description')
          .eq('page_id', p.id).order('position'));
        p._subpages = Array.isArray(rows) ? rows : [];
      } catch (e) { p._subpages = []; }
      if (sel.page === p) renderSubnav();
    }
    loadStories();
  }
  async function selectSubpage(sp) {
    sel.subpage = sp; sel.thread = null;
    renderNav();
    setCrumb();
    if (sp._threads) { renderSubnav(); }
    else {
      try {
        var rows = unwrap(await sb.from('threads')
          .select('id,subpage_id,title,description,derived_query,status,match_count,last_match_at')
          .eq('subpage_id', sp.id).order('position'));
        sp._threads = Array.isArray(rows) ? rows : [];
      } catch (e) { sp._threads = []; }
      if (sel.subpage === sp) renderSubnav();
    }
    loadStories();
  }
  function selectThread(t) {
    sel.thread = t;
    setCrumb();
    renderSubnav();
    loadStories();
  }

  // =========================================================================
  // ORGANIZE MODE
  //
  // A "mode" layered over the same data the reading view uses. It reorders and
  // renames pages / sub-pages / threads in place on the shared caches (pages,
  // page._subpages, subpage._threads), so exiting reflects every change with no
  // reload. The currently-focused page (sel.page) and sub-page (sel.subpage)
  // decide which sub-page / thread sections are shown — the same selection the
  // reading view was on when ORGANIZE was pressed.
  // =========================================================================

  // ids of items re-pended during THIS organize session, so we can show the
  // "will rebuild at next refresh" badge on exactly the ones the user edited.
  var orgEdited = {};
  // drag bookkeeping (within-level only — see orgMove)
  var dragKind = null, dragId = null;

  // ---- cache helpers: Organize reads/writes the same arrays the nav uses ----
  function orgList(kind) {
    if (kind === 'page') return pages;
    if (kind === 'subpage') return (sel.page && sel.page._subpages) || [];
    return (sel.subpage && sel.subpage._threads) || [];
  }
  function orgFindRow(kind, id) {
    return orgList(kind).filter(function (r) { return r.id === id; })[0] || null;
  }
  function orgTable(kind) {
    return kind === 'page' ? 'pages' : (kind === 'subpage' ? 'subpages' : 'threads');
  }

  // lazily fetch + cache a page's sub-pages / a sub-page's threads (mirrors the
  // selects used by selectPage / selectSubpage so the row shapes match)
  async function ensureSubpagesLoaded(p) {
    if (p._subpages) return;
    try {
      var rows = unwrap(await sb.from('subpages')
        .select('id,page_id,title,slug,query,status,description')
        .eq('page_id', p.id).order('position'));
      p._subpages = Array.isArray(rows) ? rows : [];
    } catch (e) { p._subpages = []; }
  }
  async function ensureThreadsLoaded(sp) {
    if (sp._threads) return;
    try {
      var rows = unwrap(await sb.from('threads')
        .select('id,subpage_id,title,description,derived_query,status,match_count,last_match_at')
        .eq('subpage_id', sp.id).order('position'));
      sp._threads = Array.isArray(rows) ? rows : [];
    } catch (e) { sp._threads = []; }
  }

  // ---- rendering ----
  function orgChip(kind, row) {
    if (kind === 'page') {
      var region = REGION[row.slug];
      return '<span class="org-chip">region · ' + esc(region || row.slug || '—') + '</span>';
    }
    var q = kind === 'subpage' ? row.query : row.derived_query;
    if (hasText(q)) return '<span class="org-chip">query · ' + esc(q) + '</span>';
    return '<span class="org-chip pending">building next sync</span>';
  }
  function orgRebuildBadge(kind, row) {
    return (kind !== 'page' && orgEdited[row.id])
      ? '<span class="org-rebuild">↻ will rebuild at next refresh</span>' : '';
  }
  function orgCardHtml(kind, row, focusedId) {
    var isFocused = (kind !== 'thread') && (row.id === focusedId);
    var openBtn = '';
    if (kind === 'page') openBtn = '<button class="org-open" data-open="page">View sub-pages →</button>';
    else if (kind === 'subpage') openBtn = '<button class="org-open" data-open="subpage">View threads →</button>';
    var descPlaceholder = kind === 'page'
      ? 'One line — a subtitle for this page'
      : 'One line — becomes the search query on next sync';
    return '<div class="org-card' + (isFocused ? ' focused' : '') + '" data-kind="' + kind + '" data-id="' + esc(row.id) + '">' +
        '<div class="org-grip" title="Drag to reorder">⠿</div>' +
        '<div class="org-fields">' +
          '<input class="org-title" data-field="title" value="' + esc(row.title || '') + '" placeholder="Title" autocomplete="off">' +
          '<input class="org-desc" data-field="description" value="' + esc(row.description || '') + '" placeholder="' + esc(descPlaceholder) + '" autocomplete="off">' +
          '<div class="org-meta">' + orgChip(kind, row) + orgRebuildBadge(kind, row) + '</div>' +
        '</div>' +
        (openBtn ? '<div class="org-card-actions">' + openBtn + '</div>' : '') +
      '</div>';
  }
  function orgSectionHtml(label, labelId, level, rows, focusedId, addLabel, addKind) {
    var cards = rows.length
      ? rows.map(function (r) { return orgCardHtml(level, r, focusedId); }).join('')
      : '<div class="org-empty">Nothing here yet.</div>';
    return '<div class="org-section">' +
      '<div class="section-label"' + (labelId ? ' id="' + labelId + '"' : '') + '>' + esc(label) + '</div>' +
      '<div class="hairline"></div>' +
      '<div class="org-cards" data-level="' + level + '">' + cards + '</div>' +
      '<button class="org-add" data-add="' + addKind + '">' + esc(addLabel) + '</button>' +
    '</div>';
  }
  function renderOrganize() {
    if (!sel.page) { organizeRoot.innerHTML = ''; return; }
    var html = '';
    html += '<div class="org-top"><button class="btn ghost org-back">← Back to reading</button></div>';
    html += '<div class="org-head">' +
      '<div class="eyebrow">ORGANIZE</div>' +
      '<h1 class="page-h1">Pages, sub-pages &amp; threads</h1>' +
      '<p class="page-intro">Drag the handle to reorder within a level. Edit a title or one-line description, then click away to save — for sub-pages and threads that sends it back to <b>pending</b> and the next sync rewrites its search query from what you typed. Pages are region-based, so editing a page is just cosmetic.</p>' +
    '</div>';

    // TOP PAGES
    html += orgSectionHtml(
      'TOP PAGES · DRAG TO REORDER', null, 'page',
      pages, sel.page.id, '+ Add a top page', 'page');

    // SUB-PAGES under the focused page
    html += orgSectionHtml(
      'SUB-PAGES UNDER ‘' + sel.page.title + '’', 'orgSubLabel', 'subpage',
      (sel.page._subpages || []), (sel.subpage ? sel.subpage.id : null),
      '+ Add a sub-page', 'subpage');

    // THREADS under the focused sub-page (only when one is focused)
    if (sel.subpage) {
      html += orgSectionHtml(
        'THREADS IN ‘' + sel.subpage.title + '’', 'orgThreadLabel', 'thread',
        (sel.subpage._threads || []), null, '+ Add a thread', 'thread');
    }

    organizeRoot.innerHTML = html;
  }

  // keep the two section headers in sync after an inline title edit (cheaper
  // than a full re-render, and it won't disturb input focus)
  function updateOrgHeaders() {
    var subL = document.getElementById('orgSubLabel');
    if (subL && sel.page) subL.textContent = 'SUB-PAGES UNDER ‘' + sel.page.title + '’';
    var thL = document.getElementById('orgThreadLabel');
    if (thL && sel.subpage) thL.textContent = 'THREADS IN ‘' + sel.subpage.title + '’';
  }
  function updateCardMeta(kind, row, card) {
    var meta = card.querySelector('.org-meta');
    if (meta) meta.innerHTML = orgChip(kind, row) + orgRebuildBadge(kind, row);
  }
  function focusOrgInput(id, field) {
    var el = organizeRoot.querySelector('.org-card[data-id="' + id + '"] .org-' + field);
    if (el) { el.focus(); el.select(); }
  }

  // ---- inline edit (save on blur / Enter) ----
  function onOrgFieldBlur(input) {
    var card = input.closest('.org-card'); if (!card) return;
    var kind = card.getAttribute('data-kind');
    var id = card.getAttribute('data-id');
    var field = input.getAttribute('data-field');
    var row = orgFindRow(kind, id); if (!row) return;
    var val = input.value.trim();
    if (field === 'title' && !val) {
      input.value = row.title || '';
      toast('Give it a title first');
      return;
    }
    if (val === (row[field] || '')) return;   // nothing changed
    saveOrgField(kind, row, field, val, card);
  }

  async function saveOrgField(kind, row, field, val, card) {
    // CRITICAL: editing a sub-page or thread's title/description re-pends it
    // (status -> 'pending', query/derived_query -> null) so the NEXT SYNC
    // rebuilds the query from the new text. Pages are cosmetic — never re-pend.
    // We never send `slug`, so the row's underlying identity stays fixed.
    var repend = (kind !== 'page');
    var update = {};
    update[field] = val;
    if (repend) {
      update.status = 'pending';
      if (kind === 'subpage') update.query = null; else update.derived_query = null;
    }
    try {
      unwrap(await sb.from(orgTable(kind)).update(update).eq('id', row.id));
      row[field] = val;
      if (repend) {
        row.status = 'pending';
        if (kind === 'subpage') row.query = null; else row.derived_query = null;
        orgEdited[row.id] = true;
      }
      updateCardMeta(kind, row, card);
      if (field === 'title') updateOrgHeaders();
      if (repend) loadPendingQueue();   // refresh the "Building at next refresh" list
      toast(repend ? 'Saved — rebuilds next sync' : 'Saved');
    } catch (err) {
      toast('Could not save — try again');
    }
  }

  // ---- reorder (within-level only; updates the `position` column) ----
  function clearDropMarks() {
    Array.prototype.forEach.call(organizeRoot.querySelectorAll('.org-card'), function (c) {
      c.classList.remove('drop-before', 'drop-after');
    });
  }
  function persistPositions(kind) {
    var list = orgList(kind);
    var table = orgTable(kind);
    var ops = list.map(function (row, i) {
      row.position = i;
      return sb.from(table).update({ position: i }).eq('id', row.id);
    });
    Promise.all(ops).catch(function () { toast('Could not save the new order'); });
  }
  function indexOfId(list, id) {
    for (var i = 0; i < list.length; i++) { if (list[i].id === id) return i; }
    return -1;
  }
  function orgMove(kind, fromId, toId, after) {
    if (fromId === toId) return;
    var list = orgList(kind);
    var fromIdx = indexOfId(list, fromId);
    if (fromIdx < 0) return;
    var item = list.splice(fromIdx, 1)[0];
    var toIdx = indexOfId(list, toId);      // recompute after the removal
    if (toIdx < 0) { list.splice(fromIdx, 0, item); return; }
    list.splice(after ? toIdx + 1 : toIdx, 0, item);
    persistPositions(kind);
    renderOrganize();
  }

  // ---- focus a different page / sub-page ----
  async function orgOpen(kind, id) {
    if (kind === 'page') {
      var p = orgFindRow('page', id); if (!p) return;
      sel.page = p; sel.subpage = null; sel.thread = null;
      await ensureSubpagesLoaded(p);
    } else if (kind === 'subpage') {
      var sp = orgFindRow('subpage', id); if (!sp) return;
      sel.subpage = sp; sel.thread = null;
      await ensureThreadsLoaded(sp);
    }
    renderOrganize();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ---- add (same shape as the existing create flow) ----
  function uniquePageSlug(base) {
    var slug = slugify(base);
    var taken = {};
    pages.forEach(function (p) { taken[p.slug] = true; });
    if (!taken[slug]) return slug;
    var i = 2;
    while (taken[slug + '-' + i]) i++;
    return slug + '-' + i;
  }
  async function addPage() {
    var body = { title: 'New page', slug: uniquePageSlug('new-page'), position: pages.length };
    try {
      var rows = unwrap(await sb.from('pages').insert(body).select());
      var created = (Array.isArray(rows) && rows.length) ? rows[0] : body;
      created._subpages = [];   // brand-new page has no sub-pages
      pages.push(created);
      renderOrganize();
      focusOrgInput(created.id, 'title');
      toast('Page added');
    } catch (e) { toast('Could not add the page'); }
  }
  async function addSubpage() {
    if (!sel.page) return;
    var list = sel.page._subpages || (sel.page._subpages = []);
    var body = {
      page_id: sel.page.id, title: 'New sub-page', slug: slugify('New sub-page'),
      description: '', status: 'pending', query: null, position: list.length
    };
    try {
      var rows = unwrap(await sb.from('subpages').insert(body).select());
      var created = (Array.isArray(rows) && rows.length) ? rows[0] : body;
      list.push(created);
      renderOrganize();
      focusOrgInput(created.id, 'title');
      loadPendingQueue();
      toast('Sub-page added — query builds next sync');
    } catch (e) { toast('Could not add the sub-page'); }
  }
  async function addThread() {
    if (!sel.subpage) return;
    // same per-user thread cap as the reading-view create flows
    try {
      var res = await sb.from('threads').select('id', { count: 'exact', head: true });
      if (res.error) throw res.error;
      if ((res.count || 0) >= THREAD_CAP) {
        toast("You've hit your thread limit (" + THREAD_CAP + ") — archive one to add another");
        return;
      }
    } catch (e) {
      toast('Could not check your thread count — try again');
      return;
    }
    var list = sel.subpage._threads || (sel.subpage._threads = []);
    var body = {
      subpage_id: sel.subpage.id, title: 'New thread', description: '',
      status: 'pending', derived_query: null, position: list.length
    };
    try {
      var rows = unwrap(await sb.from('threads').insert(body).select());
      var created = (Array.isArray(rows) && rows.length) ? rows[0] : body;
      list.push(created);
      renderOrganize();
      focusOrgInput(created.id, 'title');
      loadPendingQueue();
      toast('Thread added — query builds next sync');
    } catch (e) { toast('Could not add the thread'); }
  }

  // ---- enter / exit ----
  async function enterOrganize() {
    if (document.body.classList.contains('organizing')) return;
    if (!sel.page) { toast('Still loading your pages…'); return; }
    closeForm();
    await ensureSubpagesLoaded(sel.page);
    if (sel.subpage) await ensureThreadsLoaded(sel.subpage);
    document.body.classList.add('organizing');
    crumbEl.innerHTML = '<span class="seg">~</span><span class="sep">/</span><span class="seg">organize</span>';
    renderOrganize();
    window.scrollTo(0, 0);
  }
  function exitOrganize() {
    document.body.classList.remove('organizing');
    organizeRoot.innerHTML = '';
    // rebuild the reading view from the (now-edited) caches
    setCrumb();
    renderNav();
    renderSubnav();
    loadStories();   // a re-pended sub-page/thread now shows its pending state
  }

  organizeBtn.addEventListener('click', enterOrganize);

  // ---- delegated wiring (organizeRoot is stable; its innerHTML is rebuilt) ----
  organizeRoot.addEventListener('click', function (e) {
    if (e.target.closest('.org-back')) { exitOrganize(); return; }
    var add = e.target.closest('.org-add');
    if (add) {
      var w = add.getAttribute('data-add');
      if (w === 'page') addPage();
      else if (w === 'subpage') addSubpage();
      else addThread();
      return;
    }
    var open = e.target.closest('.org-open');
    if (open) {
      var card = open.closest('.org-card');
      orgOpen(open.getAttribute('data-open'), card.getAttribute('data-id'));
    }
  });
  organizeRoot.addEventListener('focusout', function (e) {
    var input = e.target.closest('.org-title, .org-desc');
    if (input) onOrgFieldBlur(input);
  });
  organizeRoot.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var input = e.target.closest('.org-title, .org-desc');
    if (input) { e.preventDefault(); input.blur(); }   // blur triggers the save
  });
  // drag only starts from the grip, so the text inputs stay freely selectable
  organizeRoot.addEventListener('mousedown', function (e) {
    var grip = e.target.closest('.org-grip');
    if (grip) { var c = grip.closest('.org-card'); if (c) c.setAttribute('draggable', 'true'); }
  });
  // if a grip press didn't turn into a drag, drop the draggable flag again so
  // the card's text inputs stay freely selectable
  document.addEventListener('mouseup', function () {
    if (!document.body.classList.contains('organizing')) return;
    Array.prototype.forEach.call(organizeRoot.querySelectorAll('.org-card[draggable="true"]'), function (c) {
      c.setAttribute('draggable', 'false');
    });
  });
  organizeRoot.addEventListener('dragstart', function (e) {
    var card = e.target.closest('.org-card'); if (!card) return;
    dragKind = card.getAttribute('data-kind');
    dragId = card.getAttribute('data-id');
    card.classList.add('dragging');
    if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (_) {} }
  });
  organizeRoot.addEventListener('dragover', function (e) {
    var card = e.target.closest('.org-card'); if (!card || !dragKind) return;
    if (card.getAttribute('data-kind') !== dragKind) return;   // within-level only
    e.preventDefault();
    var r = card.getBoundingClientRect();
    var after = (e.clientY - r.top) > r.height / 2;
    clearDropMarks();
    card.classList.add(after ? 'drop-after' : 'drop-before');
  });
  organizeRoot.addEventListener('drop', function (e) {
    var card = e.target.closest('.org-card'); if (!card || !dragKind) return;
    if (card.getAttribute('data-kind') !== dragKind) return;
    e.preventDefault();
    var r = card.getBoundingClientRect();
    var after = (e.clientY - r.top) > r.height / 2;
    var toId = card.getAttribute('data-id');
    clearDropMarks();
    orgMove(dragKind, dragId, toId, after);
  });
  organizeRoot.addEventListener('dragend', function (e) {
    var card = e.target.closest('.org-card');
    if (card) { card.classList.remove('dragging'); card.setAttribute('draggable', 'false'); }
    clearDropMarks();
    dragKind = null; dragId = null;
  });
})();
</script>
</body>
</html>
